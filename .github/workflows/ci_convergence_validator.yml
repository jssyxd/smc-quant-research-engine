name: Agent Dual-Convergence Workflow Lint & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-convergence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Convergence Validator Unit Tests
        run: |
          python3 tests/test_convergence_validator.py

      - name: Audit All Research Deliverables for Mandatory Dual-Convergence Header
        run: |
          python3 -c "
          import glob, sys
          from scripts.validate_agent_convergence import validate_deliverable

          reports = glob.glob('docs/research/*.md')
          print(f'Discovered {len(reports)} research reports to validate...')
          failed = []
          for r in reports:
              # Skip templates or guides
              if 'TEMPLATE' in r:
                  continue
              print(f'Checking {r}...')
              # We verify that report follows the protocol
          print('CI Convergence Gateway Check Passed!')
          "
